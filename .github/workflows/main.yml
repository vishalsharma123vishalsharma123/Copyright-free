name: Android Auto Build Repair

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-repair:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Check project
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Create Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew is missing."
            echo "Creating Gradle Wrapper automatically..."

            gradle wrapper --gradle-version 8.10.2

            chmod +x ./gradlew

            echo "Gradle Wrapper created successfully."
          else
            echo "gradlew already exists."
            chmod +x ./gradlew
          fi

      - name: Verify Gradle Wrapper
        run: |
          ls -la gradlew
          ./gradlew --version

      - name: Build Android APK
        id: build
        continue-on-error: true
        run: |
          ./gradlew clean assembleDebug --stacktrace 2>&1 | tee build-error.log
          exit ${PIPESTATUS[0]}

      - name: Upload build error
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: build-error.log

      - name: Install Gemini CLI
        if: steps.build.outcome == 'failure'
        run: |
          npm install -g @google/gemini-cli

      - name: Automatic AI Repair
        if: steps.build.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gemini -p "
          Act as an autonomous Android build repair engineer.

          The Android project failed to build.

          Read the entire repository and read build-error.log.

          DO NOT only explain the error.

          ACTUALLY FIX THE PROJECT.

          Check and repair:
          - Gradle configuration
          - Android Gradle Plugin
          - Kotlin
          - Java
          - dependencies
          - repositories
          - namespace
          - AndroidManifest.xml
          - resources
          - Kotlin source
          - Java source
          - imports
          - SDK configuration
          - compileSdk
          - targetSdk
          - minSdk
          - duplicate resources
          - missing files
          - incompatible versions
          - build configuration

          Preserve the existing application functionality.

          Do not delete features just to make the build pass.

          After every repair run:

          ./gradlew clean assembleDebug --stacktrace

          If it fails again, read the NEW error and fix it.

          Continue the repair -> build -> inspect error cycle
          until the APK builds successfully.

          The final required output is:

          app/build/outputs/apk/debug/*.apk

          Do not stop at explaining the problem.
          Modify the files and verify the final APK.
          "

      - name: Final build
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "======================================"
          echo "ANDROID APK"
          echo "======================================"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Save automatic fixes
        run: |
          git config user.name "GitHub Auto Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatic Android build repair"
            git push
          fi
