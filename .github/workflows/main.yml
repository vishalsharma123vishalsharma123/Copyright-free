name: Android Auto Build Repair

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-repair:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        run: |
          echo "Checking Android project..."
          ls -la
          find . -maxdepth 2 -type f | sort | head -200

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew file is missing."
            exit 1
          fi

      - name: First Android build
        id: first_build
        continue-on-error: true
        run: |
          ./gradlew clean assembleDebug --stacktrace 2>&1 | tee build-error.log
          exit ${PIPESTATUS[0]}

      - name: Install Gemini CLI
        if: steps.first_build.outcome == 'failure'
        run: |
          npm install -g @google/gemini-cli

      - name: AI automatic repair
        if: steps.first_build.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gemini -p "
          You are an autonomous Android project repair agent.

          IMPORTANT:
          Do not only explain errors.
          You must actually modify the repository files.

          The Android project in this GitHub repository failed to build.

          Read:
          - the complete project structure
          - build-error.log
          - Gradle files
          - settings.gradle.kts
          - build.gradle.kts
          - app module
          - AndroidManifest.xml
          - Kotlin/Java source
          - resources
          - dependencies

          Find the ROOT CAUSE of the build failure.

          Automatically repair:
          - Kotlin/Java compilation errors
          - Gradle errors
          - dependency conflicts
          - missing dependencies
          - incorrect plugin versions
          - Android SDK configuration
          - namespace problems
          - manifest problems
          - resource problems
          - imports
          - incompatible APIs
          - incorrect project configuration

          Do not delete working app functionality just to make the
          build pass.

          Make the smallest safe changes possible.

          After making changes, run:

          ./gradlew clean assembleDebug --stacktrace

          If the build fails again:

          1. Read the new error.
          2. Find its root cause.
          3. Fix the files.
          4. Run the build again.

          Continue this repair-build-test cycle until:

          BUILD SUCCESSFULLY COMPLETES

          The final objective is:

          app/build/outputs/apk/debug/*.apk

          Do not stop at an explanation.
          Do not merely tell me what is wrong.
          Actually repair the project and verify the APK build.
          "

      - name: Final verification build
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===================================="
          echo "APK FILES"
          echo "===================================="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit automatic repairs
        run: |
          git config user.name "GitHub Auto Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatic Android build repair"
            git push
          fi
